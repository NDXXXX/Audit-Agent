[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-agent"
version = "0.2.0"
description = "Multi-agent code review with adversarial verification — powered by LangGraph and DeepSeek."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langchain-deepseek>=1.1",
    "langgraph>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tavily-python>=0.7.26",
    "textual>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
audit = "audit_agent.cli.app:app"
audit-tui = "audit_agent.cli.tui.app:run_tui"

[project.urls]
Homepage = "https://github.com/NDXXXX/DDclaw"
Repository = "https://github.com/NDXXXX/DDclaw"
Issues = "https://github.com/NDXXXX/DDclaw/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["audit_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
